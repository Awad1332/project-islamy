<title>نبض — لوحة الإدارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
:root{
  --ground:#F8FAFC; --surface:#FFFFFF; --surface-2:#F1F5F9; --line:#E2E8F0; --ink:#0F172A; --ink-2:#475569; --ink-3:#64748B; --rail:#0F172A; --rail-ink:#CBD5E1; --rail-active:#1E293B; --accent:#10B981; --accent-ink:#0F172A; --accent-soft:#D1FAE5; --good:#15803D; --good-soft:#DCFCE7; --warn:#A16207; --warn-soft:#FEF9C3; --bad:#B91C1C; --bad-soft:#FEE2E2; --info:#1D4ED8; --info-soft:#DBEAFE; --shadow:0 1px 2px rgba(15,23,42,.05),0 6px 20px rgba(15,23,42,.06); --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif; --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif; --accent-fg:#047857;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  color-scheme:dark; --ground:#0F172A; --surface:#1E293B; --surface-2:#273449; --line:#334155; --ink:#F8FAFC; --ink-2:#CBD5E1; --ink-3:#94A3B8; --rail:#0B1222; --rail-ink:#CBD5E1; --rail-active:#1E293B; --accent:#10B981; --accent-ink:#0F172A; --accent-soft:#0F3D33; --good:#4ADE80; --good-soft:#14352A; --warn:#FACC15; --warn-soft:#3B3410; --bad:#F87171; --bad-soft:#3F1D24; --info:#93C5FD; --info-soft:#1E2F4F; --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.3); --accent-fg:#34D399;
}
}
:root[data-theme="dark"]{
  color-scheme:dark; --ground:#0F172A; --surface:#1E293B; --surface-2:#273449; --line:#334155; --ink:#F8FAFC; --ink-2:#CBD5E1; --ink-3:#94A3B8; --rail:#0B1222; --rail-ink:#CBD5E1; --rail-active:#1E293B; --accent:#10B981; --accent-ink:#0F172A; --accent-soft:#0F3D33; --good:#4ADE80; --good-soft:#14352A; --warn:#FACC15; --warn-soft:#3B3410; --bad:#F87171; --bad-soft:#3F1D24; --info:#93C5FD; --info-soft:#1E2F4F; --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.3); --accent-fg:#34D399;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;direction:rtl}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.35;text-wrap:balance}
h1{font-size:1.35rem;font-weight:700} h2{font-size:1.02rem;font-weight:600} h3{font-size:.95rem;font-weight:600}
p{margin:0}
.num,td.n{font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);padding:18px 12px;display:flex;flex-direction:column;gap:16px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding-inline:6px}
.mark{width:32px;height:32px;border-radius:9px;background:#10B981;color:#0F172A;display:grid;place-items:center}
.mark svg{width:20px;height:20px}
.brand b{font-family:var(--f-display);color:#fff;font-size:1.15rem;display:block;line-height:1.2}
.brand small{font-size:.7rem;letter-spacing:.04em;color:#94A3B8}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{border:0;background:none;color:var(--rail-ink);text-align:start;padding:8px 10px;border-radius:8px;display:flex;align-items:center;gap:9px}
.nav button:hover{background:var(--rail-active)}
.nav button[aria-current="page"]{background:var(--rail-active);color:#fff;font-weight:600;box-shadow:inset -3px 0 0 #10B981}
.nav svg{width:18px;height:18px;flex:none}
.rail-foot{margin-top:auto;font-size:.75rem;border-top:1px solid #1E293B;padding-top:10px;color:#94A3B8}

.main{padding-block:20px 60px;padding-inline:26px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.sample{font-size:.74rem;color:var(--warn);background:var(--warn-soft);padding:3px 10px;border-radius:99px}
.view{display:none} .view.on{display:block}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3);font-size:.8rem}
.eyebrow{font-size:.74rem;font-weight:600;color:var(--ink-3);letter-spacing:.02em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}

.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{font-size:.78rem;color:var(--ink-2)}
.kpi .v{font-family:var(--f-display);font-size:1.4rem;font-weight:600}
.kpi .v small{font-size:.75rem;color:var(--ink-2);font-weight:500;margin-inline-start:3px}
.kpi .d{font-size:.76rem;font-weight:600}
.up{color:var(--good)} .down{color:var(--bad)}

.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:.78rem;padding:5px 9px;border-radius:7px;white-space:nowrap;transform:translate(50%,-110%);z-index:5}
.hbar{display:grid;grid-template-columns:90px 1fr 70px;gap:10px;align-items:center;padding:5px 0}
.hbar .track{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hbar .fill{height:100%;background:var(--accent);border-radius:4px}
.hbar .val{text-align:end;font-variant-numeric:tabular-nums;font-weight:600;font-size:.85rem}
.hbar:hover .fill{filter:brightness(1.12)}
.list-item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.list-item:last-child{border-bottom:0}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:9px;font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent-fg);color:var(--accent-ink)}
.btn.sm{padding:4px 10px;font-size:.82rem}
.btn.danger{color:var(--bad)}
.link{border:0;background:none;color:var(--accent-fg);font-weight:600;padding:0}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select,.field input,.field select,.field textarea,.rule select,.rule input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px}
.toolbar input{flex:1 1 220px}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.74rem;color:var(--ink-3);font-weight:600;background:var(--surface-2);position:sticky;top:0}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.p-active{background:var(--good-soft);color:var(--good)}
.p-trial{background:var(--info-soft);color:var(--info)}
.p-past_due{background:var(--warn-soft);color:var(--warn)}
.p-cancelled{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.plan-tag{font-size:.76rem;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.health{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.8rem}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* plans */
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.plan .price{font-family:var(--f-display);font-size:1.5rem;font-weight:600}
.plan .price small{font-size:.8rem;color:var(--ink-2);font-weight:500}
.plan ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:.85rem}
.plan li{display:flex;gap:6px}
.plan li.off{color:var(--ink-3);text-decoration:line-through}
.plan .foot{margin-top:auto;border-top:1px solid var(--line);padding-top:10px;display:flex;justify-content:space-between;font-size:.82rem}

/* segments */
.rule{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--surface-2);border-radius:10px;padding:8px}
.rule .and{font-weight:700;color:var(--ink-3);font-size:.78rem;min-width:28px}
.seg-result{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg-result div{background:var(--surface-2);border-radius:10px;padding:10px}
.seg-result b{font-family:var(--f-display);font-size:1.3rem;display:block}
.preset{border:1px dashed var(--line);background:var(--surface);border-radius:10px;padding:10px;text-align:start;display:grid;gap:2px}
.preset:hover{border-color:var(--accent-fg)}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}

.notice{background:var(--info-soft);border-radius:10px;padding:10px 12px;font-size:.85rem}
.notice.warn{background:var(--warn-soft)}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;justify-content:flex-start}
.drawer{background:var(--surface);width:min(520px,100%);height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.center{justify-content:center;align-items:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:20px;display:grid;gap:12px;box-shadow:var(--shadow)}
.field{display:grid;gap:4px}
.field label{font-size:.78rem;color:var(--ink-3);font-weight:600}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.checks label{display:flex;gap:6px;align-items:center;font-size:.86rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.88rem}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;font-weight:600}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.minis div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.minis b{display:block;font-family:var(--f-display);font-size:1.1rem}
.locked{background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:.85rem;color:var(--ink-2)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:10px;font-weight:600;z-index:70}
.pager{display:flex;justify-content:space-between;align-items:center;padding:8px 2px}

.mtop{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;padding:12px 16px}
  .rail .rail-foot,.rail .brand small{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav button{white-space:nowrap;padding:6px 10px}
  .nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 #10B981}
  .main{padding-inline:16px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid2,.grid3,.seg-result,.fields2,.checks{grid-template-columns:1fr}
}
.theme-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-grid;place-items:center;cursor:pointer;flex:none}
.theme-btn:hover{border-color:var(--accent-fg)}
.theme-btn svg{width:19px;height:19px}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-pulse" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M2 13h4l2-6 4 12 3-9 2 3h5"/></symbol>
  <symbol id="i-over" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-store" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M4 9l1.5-5h13L20 9M4 9h16M4 9v11h16V9M9 20v-6h6v6"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21a7 7 0 0 1 14 0M17 3a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/></symbol>
  <symbol id="i-plan" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M3 7l9-4 9 4-9 4zM3 12l9 4 9-4M3 17l9 4 9-4"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></symbol>
  <symbol id="i-audit" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4"/></symbol>
</svg>

<div class="shell">
  <aside class="rail">
    <div class="brand"><div class="mark"><svg><use href="#i-pulse"/></svg></div><div><b>نبض</b><small>لوحة الإدارة</small></div></div>
    <nav class="nav" id="nav" aria-label="أقسام الإدارة"></nav>
    <div class="rail-foot">مسجل الدخول: عوض · مالك<br>المصادقة الثنائية مفعّلة</div>
  </aside>
  <main class="main">
    <div class="top">
      <div id="page-title"></div>
      <div class="row" style="gap:8px"><span class="sample">معاينة ببيانات تجريبية مولّدة</span><button class="theme-btn" type="button" data-theme-toggle aria-label="الوضع الداكن" title="تبديل الوضع الداكن والفاتح"></button></div>
    </div>

    <section class="view" id="v-overview"></section>
    <section class="view" id="v-stores"></section>
    <section class="view" id="v-users"></section>
    <section class="view" id="v-plans"></section>
    <section class="view" id="v-segments"></section>
    <section class="view" id="v-audit"></section>
  </main>
</div>
<div id="overlay"></div>

<script>
(function(){
/* ---------- sample data ---------- */
let seed=20260925; const rnd=()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296};
const pick=a=>a[Math.floor(rnd()*a.length)];
const NAMES=['متجر العود','عبايات لمى','بن الجنوب','ركن التقنية','تمور الواحة','دار البخور','أناقة نجد','عطور الشرق','حلا للهدايا','بيت القهوة','مسك وعنبر','زهرة الطائف','ملابس رواء','مكتبة القلم','عالم الأطفال','ساعات الفخامة','الورد الأحمر','نكهة الشام','إكسسوار دانة','جمال الطبيعة','عسل السراة','رياضة برو','أثاث المنزل','حقائب ريم','كوفي بوكس','بخور الملوك','تقنية الغد','أزياء سديم','عناية فاخرة','شوكولاتة أثير','ركن الألعاب','لؤلؤة الخليج','عطر الصحراء','بيت الأعشاب','مخمل','سوق الجوال','قهوة حائل','مجوهرات نورة','دار الأقمشة','ورق وألوان','صحتي أولا','نسمات','مطبخ سارة','إضاءة المنزل','مزرعة الخير','دلال للعباءات','هيل وزعفران','فن الخط'];
const CATS=['عطور وبخور','أزياء وعبايات','قهوة وتمور','إلكترونيات','هدايا','عناية وتجميل','منزل'];
const CITIES=['الرياض','جدة','الدمام','مكة','المدينة','الخبر','أبها','الطائف','بريدة'];
const OWNERS=['فهد','لمى','عبدالله','سارة','محمد','نورة','خالد','ريم','سلطان','هيفاء','ماجد','دانة','تركي','أمل','بندر','رواء'];
const BANDS=['<50','50-300','300-1,500','1,500-6,000','6,000+'];
const BAND_REV={'<50':'< 10 آلاف','50-300':'10–60 ألف','300-1,500':'60–300 ألف','1,500-6,000':'300 ألف–1.2 مليون','6,000+':'> 1.2 مليون'};
const AGENCIES=['—','—','—','—','—','—','—','—','—','خبراء المنصات','خبراء المنصات','وكالة رواد'];

let PLANS=[
 {code:'free',name:'المجانية',price:0,src:'free',vis:'public',maxOrders:50,trial:0,feat:{brief_email:false,ga4:false,weekly_pdf:false,agency:false,ai_chat:false},exps:0,opps:'فرصة أسبوعيًا',users:1},
 {code:'starter',name:'الأساسية',price:59,src:'salla',vis:'public',maxOrders:300,trial:14,feat:{brief_email:false,ga4:false,weekly_pdf:false,agency:false,ai_chat:false},exps:2,opps:'أهم 5',users:1},
 {code:'growth',name:'النمو',price:120,src:'salla',vis:'public',maxOrders:1500,trial:14,feat:{brief_email:true,ga4:true,weekly_pdf:true,agency:false,ai_chat:false},exps:5,opps:'كل الفرص',users:3},
 {code:'pro',name:'الاحترافية',price:340,src:'salla',vis:'public',maxOrders:6000,trial:14,feat:{brief_email:true,ga4:true,weekly_pdf:true,agency:false,ai_chat:true},exps:null,opps:'كل الفرص + الشذوذ',users:10},
 {code:'agency',name:'وكالات',price:99,src:'direct',vis:'hidden',maxOrders:1500,trial:0,feat:{brief_email:true,ga4:true,weekly_pdf:true,agency:true,ai_chat:false},exps:5,opps:'كل الفرص',users:null,perStore:true}
];
const FEAT_LABEL={brief_email:'الملخص اليومي بالبريد',ga4:'ربط Google Analytics',weekly_pdf:'تقرير PDF أسبوعي',agency:'لوحة الوكالة',ai_chat:'مساعد المحادثة'};

const stores=NAMES.map((n,i)=>{
  const band=pick(['<50','50-300','50-300','300-1,500','300-1,500','300-1,500','1,500-6,000','6,000+']);
  const agency=pick(AGENCIES);
  let plan = agency!=='—'?'agency': band==='<50'?'free': pick(band==='50-300'?['starter','starter','growth']:band==='300-1,500'?['starter','growth','growth','growth']:['growth','pro','pro']);
  let status = plan==='free'?'active':pick(['active','active','active','active','trial','trial','past_due','cancelled']);
  const installedDays=Math.floor(rnd()*200)+3;
  const lastLogin=status==='cancelled'?Math.floor(rnd()*40)+20:Math.floor(rnd()*rnd()*25);
  const expDone=Math.floor(rnd()*(installedDays/25+1.6));
  const expWon=Math.floor(expDone*rnd()*.7);
  const expActive=status==='cancelled'?0:Math.floor(rnd()*3);
  const eng=Math.max(0,1-lastLogin/14), loop=expActive||expDone?1:rnd()*.5, data=rnd()>.15?1:.3, bill=status==='past_due'?0:1;
  const health=Math.round((.35*eng+.3*loop+.2*data+.15*bill)*100)/100;
  const owner=pick(OWNERS);
  return {id:'s'+(i+1),name:n,owner,email:`owner${i+1}@example.com`,phone:'05'+String(Math.floor(rnd()*1e8)).padStart(8,'0').replace(/(\d{2})(\d{3})(\d{3})/,'$1 *** $3'),
    plan,status,band,cat:pick(CATS),city:pick(CITIES),installedDays,trialLeft:status==='trial'?Math.max(1,14-Math.floor(rnd()*14)):null,
    lastLogin,expActive,expDone,expWon,oppActed:Math.round(rnd()*70),health,agency,consent:rnd()>.3,sync:data===1?'سليمة':'متوقفة: إعادة تفويض',tags:[],notes:[],
    users:1+Math.floor(rnd()*(plan==='pro'?5:plan==='growth'?3:1))};
});
const USERS=[];
stores.forEach(s=>{for(let k=0;k<s.users;k++){USERS.push({name:k===0?s.owner:pick(OWNERS),store:s.name,sid:s.id,role:k===0?'مالك':pick(['عضو','مشاهد','مدير حساب']),email:k===0?s.email:`team${k}.${s.id}@example.com`,last:k===0?s.lastLogin:Math.floor(rnd()*30),consent:k===0?s.consent:rnd()>.5,active:s.status!=='cancelled'})}});

let audit=[

function lineChart(el,vals,labels){
  const W=640,H=230,L=56,R=14,T=14,B=30,max=Math.ceil(Math.max(...vals)/5000)*5000||5000;
  const x=i=>L+(W-L-R)*i/(vals.length-1);
  const y=v=>T+(H-T-B)*(1-v/max);
  const ticks=[0,max/2,max];
  const pts=vals.map((v,i)=>[x(i),y(v)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=d+` L${pts[pts.length-1][0].toFixed(1)} ${y(0)} L${pts[0][0].toFixed(1)} ${y(0)} Z`;
  const last=pts[pts.length-1];
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="direction:ltr" role="img" aria-label="MRR يرتفع من ${fmt(vals[0])} إلى ${fmt(vals[vals.length-1])} ر.س">
   ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-8}" y="${y(t)+4}" font-size="11" text-anchor="end" fill="var(--ink-3)">${fmt(t)}</text>`).join('')}
   ${labels.map((l,i)=>i%2===1||i===vals.length-1?`<text x="${x(i)}" y="${H-8}" font-size="11" text-anchor="middle" fill="var(--ink-3)">${l}</text>`:'').join('')}
   <path d="${area}" fill="var(--accent-soft)" opacity=".8"/>
   <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
   <circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
   <line id="xh" x1="0" x2="0" y1="${T}" y2="${y(0)}" stroke="var(--ink-3)" stroke-dasharray="3 3" visibility="hidden"/>
   <circle id="xd" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
   <rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" id="hit"/>
  </svg><div class="tip" hidden></div>`;
  const svg=el.querySelector('svg'),tip=el.querySelector('.tip'),xh=el.querySelector('#xh'),xd=el.querySelector('#xd');
  const move=ev=>{const r=svg.getBoundingClientRect();const px=(ev.clientX-r.left)/r.width*W;let best=0,bd=1e9;pts.forEach((p,i)=>{const dd=Math.abs(p[0]-px);if(dd<bd){bd=dd;best=i}});
    const p=pts[best];xh.setAttribute('x1',p[0]);xh.setAttribute('x2',p[0]);xh.setAttribute('visibility','visible');xd.setAttribute('cx',p[0]);xd.setAttribute('cy',p[1]);xd.setAttribute('visibility','visible');
    tip.hidden=false;tip.textContent=`${labels[best]}: ${fmt(vals[best])} ر.س`;tip.style.left=(p[0]/W*r.width)+'px';tip.style.top=(p[1]/H*r.height)+'px';tip.style.transform='translate(-50%,-120%)'};
  const leave=()=>{tip.hidden=true;xh.setAttribute('visibility','hidden');xd.setAttribute('visibility','hidden')};
  svg.addEventListener('pointermove',move);svg.addEventListener('pointerleave',leave);
}

     return `<article class="plan"><div class="row between"><h3>${esc(p.name)}</h3><span class="pill ${p.vis==='public'?'p-active':'p-cancelled'}">${p.vis==='public'?'ظاهرة':p.vis==='hidden'?'مخفية':'خاصة'}</span></div>

     <div class="foot"><span class="num">${subs} مشتركًا</span><span class="num">${fmt(rev)} ر.س/شهر</span></div></article>`}).join('')}</div></div>`;

/* ---------- segments ---------- */
const FIELDS={
  plan:{l:'الباقة',ops:['='],vals:()=>PLANS.map(p=>[p.code,p.name]),get:s=>s.plan},
  status:{l:'حالة الاشتراك',ops:['='],vals:()=>Object.entries(STATUS),get:s=>s.status},
  band:{l:'الطلبات الشهرية',ops:['=','≥'],vals:()=>BANDS.map(b=>[b,b]),get:s=>s.band,ord:true},
  cat:{l:'الفئة',ops:['='],vals:()=>CATS.map(c=>[c,c]),get:s=>s.cat},
  city:{l:'المدينة',ops:['='],vals:()=>CITIES.map(c=>[c,c]),get:s=>s.city},
  health:{l:'الصحة',ops:['='],vals:()=>[['g','سليم'],['y','انتباه'],['r','خطر']],get:s=>s.health>=.7?'g':s.health>=.4?'y':'r'},
  lastLogin:{l:'آخر دخول (أيام)',ops:['≥','≤'],num:true,get:s=>s.lastLogin},
  expDone:{l:'تجارب مكتملة',ops:['≥','≤'],num:true,get:s=>s.expDone},
  trialLeft:{l:'أيام متبقية في التجربة',ops:['≤'],num:true,get:s=>s.trialLeft??999},
  agency:{l:'مرتبط بوكالة',ops:['='],vals:()=>[['yes','نعم'],['no','لا']],get:s=>s.agency==='—'?'no':'yes'}
};
const PRESETS=[
 {n:'جاهز للترقية',d:'الأساسية بطلبات 300+ وتجربة مكتملة',rules:[['plan','=','starter'],['band','≥','300-1,500'],['expDone','≥','1']]},
 {n:'تجربة مجانية بلا تفعيل',d:'تنتهي خلال 5 أيام ولم يكمل تجربة',rules:[['status','=','trial'],['trialLeft','≤','5'],['expDone','≤','0']]},
 {n:'خطر إلغاء',d:'مدفوع ولم يدخل منذ 14 يومًا',rules:[['status','=','active'],['lastLogin','≥','14']]},
 {n:'سفراء محتملون',d:'تجربتان مكتملتان على الأقل وصحة جيدة',rules:[['expDone','≥','2'],['health','=','g']]}
];
let rules=PRESETS[0].rules.map(r=>r.slice()),segName=PRESETS[0].n;
function match(s){return rules.every(([f,op,v])=>{const F=FIELDS[f];if(!F||v==='')return true;const x=F.get(s);
  if(F.num){const n=Number(v);return op==='≥'?x>=n:x<=n}
  if(F.ord&&op==='≥')return BANDS.indexOf(x)>=BANDS.indexOf(v);
  return x===v})}
function renderSegments(){
  $('#v-segments').innerHTML=`<div class="stack">
   <div class="card"><h2 style="margin-bottom:8px">شرائح جاهزة</h2><div class="presets">${PRESETS.map((p,i)=>`<button class="preset" data-preset="${i}"><b>${p.n}</b><span class="faint">${p.d}</span></button>`).join('')}</div></div>
   <div class="grid2">
    <div class="card stack" style="gap:10px"><div class="row between"><h2>الشروط</h2><span class="faint">كل الشروط يجب أن تتحقق</span></div>
      <div class="field"><label for="seg-name">اسم الشريحة</label><input id="seg-name" value="${esc(segName)}"></div>
      <div id="rules" class="stack" style="gap:6px"></div>
      <div class="row"><button class="btn sm" data-addrule>+ شرط</button></div>
      <p class="faint">الحقول المتاحة تخص علاقة المتجر بنبض ومؤشرات مجمعة فقط. بيانات عملاء التاجر غير متاحة للاستهداف.</p>
    </div>
    <div class="card stack" style="gap:10px" id="seg-out"></div>
   </div></div>`;
  renderRules();
}
function renderRules(){
  $('#rules').innerHTML=rules.map((r,i)=>{const F=FIELDS[r[0]];return `<div class="rule"><span class="and">${i?'و':'إذا'}</span>
   <select data-rf="${i}" aria-label="الحقل">${Object.entries(FIELDS).map(([k,f])=>`<option value="${k}" ${k===r[0]?'selected':''}>${f.l}</option>`).join('')}</select>
   <select data-ro="${i}" aria-label="المعامل">${F.ops.map(o=>`<option ${o===r[1]?'selected':''}>${o}</option>`).join('')}</select>
   ${F.num?`<input data-rv="${i}" type="number" min="0" value="${esc(r[2])}" style="width:80px" aria-label="القيمة">`:`<select data-rv="${i}" aria-label="القيمة">${F.vals().map(([v,l])=>`<option value="${esc(v)}" ${v===r[2]?'selected':''}>${esc(l)}</option>`).join('')}</select>`}
   <button class="btn sm danger" data-delrule="${i}" aria-label="حذف الشرط">حذف</button></div>`}).join('');
  segOut();
}
function segOut(){
  const m=stores.filter(match),consent=m.filter(s=>s.consent).length,mrr=m.filter(s=>s.status==='active'||s.status==='past_due').reduce((a,s)=>a+planOf(s.plan).price,0);
  $('#seg-out').innerHTML=`<h2>النتيجة</h2><div class="seg-result"><div><span class="faint">متاجر مطابقة</span><b class="num">${m.length}</b></div><div><span class="faint">يقبلون رسائل تسويقية</span><b class="num">${consent}</b></div><div><span class="faint">إيرادهم الحالي</span><b class="num">${fmt(mrr)} <span class="faint">ر.س</span></b></div></div>
   <div class="tbl" style="max-height:260px;overflow:auto"><table><thead><tr><th>المتجر</th><th>الباقة</th><th>الطلبات</th><th>الصحة</th></tr></thead><tbody>${m.map(s=>`<tr class="click" data-store="${s.id}"><td>${esc(s.name)}</td><td>${esc(planOf(s.plan).name)}</td><td class="n">${s.band}</td><td>${healthTag(s.health)}</td></tr>`).join('')||'<tr><td colspan="4" class="faint">لا توجد متاجر مطابقة</td></tr>'}</tbody></table></div>
   <div class="row"><button class="btn" data-saveseg>حفظ الشريحة</button><button class="btn primary" data-campaign ${consent?'':'disabled'}>إرسال حملة (${consent})</button><button class="btn" data-export>تصدير CSV</button></div>`;
}

   <div><div class="eyebrow">حملة بريدية للشريحة: ${esc(segName)}</div><h2 id="cm-t">رسالة إلى ${m.length} تاجرًا</h2></div>
   <div class="notice">تُرسل فقط لمن وافق على الرسائل التسويقية، وبحد أقصى رسالة ترويجية واحدة أسبوعيًا لكل تاجر.</div>

متجرك {اسم_المتجر} تجاوز حدود الباقة الأساسية، وأكملت تجارب ناجحة معنا.

   <div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-close>إلغاء</button><button class="btn primary" type="submit">جدولة الإرسال</button></div>

function exportModal(){
  $('#overlay').innerHTML=`<div class="scrim center" data-close><form class="modal" id="exp-form" role="dialog" aria-modal="true" aria-labelledby="em-t">
   <div><div class="eyebrow">صلاحية مدير فقط</div><h2 id="em-t">تصدير الشريحة</h2></div>
   <p class="muted">الملف يحتوي على اسم التاجر وبريده وباقته ومؤشرات متجره المجمعة. لا يحتوي على بيانات عملاء المتاجر.</p>
   <div class="field"><label for="ef-why">سبب التصدير (يُسجل في التدقيق)</label><input id="ef-why" required placeholder="مثلًا: قائمة اتصال لفريق المبيعات"></div>

function renderAudit(){

/* ---------- events ---------- */
const close=()=>{$('#overlay').innerHTML=''};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-store],[data-close],[data-page],[data-act],[data-newplan],[data-preset],[data-addrule],[data-delrule],[data-saveseg],[data-campaign],[data-export]');
  if(!t)return;
  if(t.hasAttribute('data-close')&&t.classList.contains('scrim')&&e.target!==t)return;
  if(t.dataset.go)go(t.dataset.go);
  else if(t.dataset.store)storeDrawer(t.dataset.store);
  else if(t.hasAttribute('data-close'))close();
  else if(t.dataset.page){page+=Number(t.dataset.page);storesTable()}
  else if(t.dataset.act){const s=stores.find(x=>x.id===t.dataset.id),why=($('#act-reason')||{}).value?.trim();
    if(t.dataset.act!=='resync'&&!why){toast('اكتب السبب أولًا');$('#act-reason').focus();return}
    if(t.dataset.act==='trial'){s.trialLeft=(s.trialLeft||0)+7;if(s.status!=='trial')s.status='trial';log('تمديد تجربة',s.name,why);toast('مُددت التجربة 7 أيام')}
    if(t.dataset.act==='support'){log('دخول للدعم',s.name,why);toast('صلاحية دعم مؤقتة لمدة 30 دقيقة')}
    if(t.dataset.act==='resync'){log('إعادة مزامنة',s.name,why);toast('بدأت إعادة المزامنة')}
    if(t.dataset.act==='plan'){const np=$('#act-plan').value;if(planOf(np).src==='salla'&&np!==s.plan){toast('باقات سلة يغيرها التاجر من متجر التطبيقات');return}s.plan=np;log('تغيير باقة',s.name,why);toast('طُبقت الباقة: '+planOf(np).name)}
    storeDrawer(s.id); if(cur==='stores')storesTable(); if(cur==='overview')renderOverview();}
  else if(t.hasAttribute('data-newplan'))planModal();
  else if(t.dataset.preset){const p=PRESETS[+t.dataset.preset];rules=p.rules.map(r=>r.slice());segName=p.n;$('#seg-name').value=segName;renderRules()}
  else if(t.hasAttribute('data-addrule')){rules.push(['city','=',CITIES[0]]);renderRules()}
  else if(t.dataset.delrule){rules.splice(+t.dataset.delrule,1);renderRules()}
  else if(t.hasAttribute('data-saveseg')){segName=$('#seg-name').value||segName;log('حفظ شريحة',segName);toast('حُفظت الشريحة: '+segName)}
  else if(t.hasAttribute('data-campaign'))campaignModal();
  else if(t.hasAttribute('data-export'))exportModal();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Enter'&&e.target.matches('tr[data-store]'))storeDrawer(e.target.dataset.store)});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='sf-q'){sf.q=e.target.value.trim();page=0;storesTable()}
  else if(id==='uq'){uq=e.target.value.trim();usersTable()}
  else if(id==='seg-name'){segName=e.target.value}
  else if(e.target.dataset.rv!==undefined&&e.target.type==='number'){rules[+e.target.dataset.rv][2]=e.target.value;segOut()}
});
document.addEventListener('change',e=>{
  const el=e.target,id=el.id;
  if(id&&id.startsWith('sf-')&&id!=='sf-q'){sf[id.slice(3)]=el.value;page=0;storesTable()}
  else if(id==='uconsent'){uconsent=el.value;usersTable()}
  else if(el.dataset.rf!==undefined){const i=+el.dataset.rf,F=FIELDS[el.value];rules[i]=[el.value,F.ops[0],F.num?'0':F.vals()[0][0]];renderRules()}
  else if(el.dataset.ro!==undefined){rules[+el.dataset.ro][1]=el.value;segOut()}
  else if(el.dataset.rv!==undefined){rules[+el.dataset.rv][2]=el.value;segOut()}
  else if(id==='pf-src'){$('#pf-note').hidden=el.value!=='salla'}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='note-form'){const v=$('#note-in').value.trim();if(!v)return;const s=stores.find(x=>x.id===f.dataset.id);s.notes.unshift(v);log('ملاحظة تواصل',s.name,v);storeDrawer(s.id);toast('أُضيفت الملاحظة')}
  else if(f.id==='plan-form'){const feat={};Object.keys(FEAT_LABEL).forEach(k=>feat[k]=$('#pf-'+k).checked);
    const code=$('#pf-code').value.trim();if(PLANS.some(p=>p.code===code)){toast('الرمز مستخدم لباقة أخرى');return}
    PLANS.push({code,name:$('#pf-name').value.trim(),price:+$('#pf-price').value||0,src:$('#pf-src').value,vis:$('#pf-vis').value,maxOrders:+$('#pf-orders').value||null,trial:+$('#pf-trial').value||0,feat,exps:+$('#pf-exps').value,opps:'كل الفرص',users:3});
    log('إنشاء باقة',$('#pf-name').value.trim(),$('#pf-src').value==='salla'?'بانتظار الربط ببوابة سلة':'عقد مباشر');close();renderPlans();toast('أُنشئت الباقة')}
  else if(f.id==='camp-form'){const n=stores.filter(match).filter(s=>s.consent).length;log('جدولة حملة',segName,`${n} مستلمًا · ${$('#cf-sub').value}`);close();toast(`جُدولت الحملة إلى ${n} تاجرًا`)}
  else if(f.id==='exp-form'){const why=$('#ef-why').value.trim();if(!why)return;log('تصدير شريحة',segName,why);close();toast('سُجل التصدير في التدقيق (لا ملف في المعاينة)')}
});

const h=(location.hash||'').slice(1);
go(VIEWS.some(v=>v[0]===h)?h:'overview');
})();
</script>
<script>
(function(){
  var r=document.documentElement;
  var moon='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  var sun='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.9"/><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  function cur(){var t=r.getAttribute('data-theme');if(t)return t;try{return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}catch(e){return 'light'}}
  function paint(){var d=cur()==='dark';document.querySelectorAll('[data-theme-toggle]').forEach(function(b){b.innerHTML=d?sun:moon;b.setAttribute('aria-label',d?'الوضع الفاتح':'الوضع الداكن');b.title=d?'الوضع الفاتح':'الوضع الداكن'})}
  try{var s=localStorage.getItem('nabd-theme');if(s==='dark'||s==='light')r.setAttribute('data-theme',s)}catch(e){}
  document.addEventListener('click',function(e){var b=e.target.closest('[data-theme-toggle]');if(!b)return;var n=cur()==='dark'?'light':'dark';r.setAttribute('data-theme',n);try{localStorage.setItem('nabd-theme',n)}catch(err){}paint()});
  paint();
})();
</script>
