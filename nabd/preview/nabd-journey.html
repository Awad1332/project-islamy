<title>نبض — رحلة التاجر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F8FAFC; --surface:#FFFFFF; --surface-2:#F1F5F9; --line:#E2E8F0; --ink:#0F172A; --ink-2:#475569; --ink-3:#64748B; --accent:#10B981; --accent-2:#059669; --accent-ink:#0F172A; --mint:#D1FAE5; --mint-2:#A7F3D0; --gold:#A16207; --gold-soft:#FEF9C3; --good:#15803D; --good-soft:#DCFCE7; --bad:#B91C1C; --bad-soft:#FEE2E2; --info:#1D4ED8; --info-soft:#DBEAFE; --shadow:0 1px 2px rgba(15,23,42,.05),0 6px 20px rgba(15,23,42,.06); --r:14px; --f:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif; --accent-fg:#047857; --gold-fill:#FACC15; --ad-bg:#0F172A; --ad-ink:#F8FAFC;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  color-scheme:dark; --ground:#0F172A; --surface:#1E293B; --surface-2:#273449; --line:#334155; --ink:#F8FAFC; --ink-2:#CBD5E1; --ink-3:#94A3B8; --accent:#10B981; --accent-2:#34D399; --accent-ink:#0F172A; --mint:#0F3D33; --mint-2:#14543F; --gold:#FACC15; --gold-soft:#3B3410; --good:#4ADE80; --good-soft:#14352A; --bad:#F87171; --bad-soft:#3F1D24; --info:#93C5FD; --info-soft:#1E2F4F; --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.3); --accent-fg:#34D399; --gold-fill:#FACC15; --ad-bg:#020617; --ad-ink:#F8FAFC;
}
}
:root[data-theme="dark"]{
  color-scheme:dark; --ground:#0F172A; --surface:#1E293B; --surface-2:#273449; --line:#334155; --ink:#F8FAFC; --ink-2:#CBD5E1; --ink-3:#94A3B8; --accent:#10B981; --accent-2:#34D399; --accent-ink:#0F172A; --mint:#0F3D33; --mint-2:#14543F; --gold:#FACC15; --gold-soft:#3B3410; --good:#4ADE80; --good-soft:#14352A; --bad:#F87171; --bad-soft:#3F1D24; --info:#93C5FD; --info-soft:#1E2F4F; --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.3); --accent-fg:#34D399; --gold-fill:#FACC15; --ad-bg:#020617; --ad-ink:#F8FAFC;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.7;direction:rtl}
h1,h2,h3{margin:0;line-height:1.4;text-wrap:balance}
h1{font-size:1.35rem;font-weight:700} h2{font-size:1.08rem;font-weight:700} h3{font-size:.98rem;font-weight:600}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--surface);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.mark svg{width:22px;height:22px}
.brand b{font-size:1.15rem;display:block;line-height:1.2}
.brand small{color:var(--ink-3);font-size:.75rem}
.nav{padding:10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav .grp{font-size:.72rem;color:var(--ink-3);font-weight:600;padding:10px 10px 4px}
.nav button{border:0;background:none;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink-2);text-align:start;font-weight:500}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="page"]{background:var(--mint);color:var(--accent-fg);font-weight:700}
.nav svg{width:19px;height:19px;flex:none}
.nav .lock{margin-inline-start:auto;width:15px;height:15px;color:var(--ink-3)}
.side-foot{margin-top:auto;padding:14px;border-top:1px solid var(--line)}
.plan-pill{display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:.85rem}

.top{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.store{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--mint);color:var(--accent-fg);display:grid;place-items:center;font-weight:700}
.demo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--gold-soft);border-radius:10px;padding:5px 10px;font-size:.8rem}
.demo select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:2px 6px;font-size:.8rem}
.main{min-width:0}
.content{padding:22px 24px 60px;max-width:1040px}
.view{display:none} .view.on{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3);font-size:.82rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 16px;font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent-fg);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2)}
.btn.gold{background:var(--gold-fill);border-color:var(--gold-fill);color:#0F172A}
.btn.sm{padding:5px 12px;font-size:.85rem}
.btn.ghost{border-color:transparent;background:none;color:var(--accent-fg)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip svg{width:13px;height:13px}
.c-store{background:var(--info-soft);color:var(--info)}
.c-content{background:#F3E8FB;color:#7B3FA8}
.c-social{background:#FCE7EF;color:#B03664}
.c-market{background:var(--gold-soft);color:var(--gold)}
.c-ops{background:var(--mint);color:var(--accent-fg)}
:root[data-theme="dark"] .c-content{background:#2C2138;color:#C9A2EA}
:root[data-theme="dark"] .c-social{background:#3A1E2A;color:#F29BBC}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .c-content{background:#2C2138;color:#C9A2EA}:root:not([data-theme="light"]) .c-social{background:#3A1E2A;color:#F29BBC}}

/* ad banner */
.ad{display:flex;gap:16px;align-items:center;background:var(--ad-bg);color:var(--ad-ink);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden}
.ad::before{content:"";position:absolute;inset-inline-start:-30px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.08)}
.ad .ic{width:48px;height:48px;border-radius:12px;background:var(--gold-fill);color:#0F172A;display:grid;place-items:center;flex:none}
.ad .ic svg{width:26px;height:26px}
.ad .tx{flex:1;min-width:0;position:relative}
.ad .tag{font-size:.72rem;font-weight:700;color:var(--gold-fill)}
.ad b{display:block;font-size:1.02rem}
.ad .btn{background:var(--accent);color:#0F172A;border-color:transparent;position:relative;white-space:nowrap}
.ad .x{position:absolute;top:6px;inset-inline-start:8px;border:0;background:none;color:inherit;opacity:.75;width:26px;height:26px;display:grid;place-items:center}
.ad .x svg{width:16px;height:16px}

/* level hero */
.level{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:108px;height:108px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.2}
.ring .in b{font-size:1.5rem}
.bar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stat span{display:block;font-size:.76rem;color:var(--ink-3)}
.stat b{font-size:1.2rem}
.next{border:2px solid var(--accent);background:var(--mint)}

/* journey */
.stages{display:flex;flex-direction:column;gap:10px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stage-h{width:100%;border:0;background:none;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:14px 16px;text-align:start}
.st-n{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--surface-2);color:var(--ink-3)}
.stage.done .st-n{background:var(--good);color:var(--surface)}
.stage.cur{border-color:var(--accent-fg);box-shadow:0 0 0 3px var(--mint)}
.stage.cur .st-n{background:var(--accent);color:var(--accent-ink)}
.stage.locked{opacity:.7}
.st-n svg{width:20px;height:20px}
.stage-b{border-top:1px solid var(--line);padding:6px 16px 14px}
.task{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.task:last-child{border-bottom:0}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--surface)}
.tick svg{width:14px;height:14px;color:var(--surface);opacity:0}
.task.done .tick{background:var(--good);border-color:var(--good)}
.task.done .tick svg{opacity:1}
.task.done .tt{color:var(--ink-3);text-decoration:line-through}
.task .tt{font-weight:600;border:0;background:none;padding:0;text-align:start;cursor:pointer}
.task .tt:hover{color:var(--accent-fg)}
.pts{font-size:.8rem;font-weight:700;color:var(--gold);white-space:nowrap}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;justify-content:flex-start}
.drawer{background:var(--ground);width:min(560px,100%);height:100%;overflow:auto;display:flex;flex-direction:column}
.dr-h{background:var(--surface);padding:18px 20px;border-bottom:1px solid var(--line);display:grid;gap:8px;position:sticky;top:0;z-index:2}
.dr-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--mint);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.guide{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.guide-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--surface-2);gap:8px;flex-wrap:wrap}
.gstep{display:grid;grid-template-columns:1fr 1.1fr;gap:12px;padding:14px;align-items:center}
.mock{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--ground);font-size:.72rem;display:grid;grid-template-columns:1fr 70px;min-height:120px}
.mock .ms{background:var(--surface);border-inline-start:1px solid var(--line);padding:6px;display:grid;gap:3px;align-content:start}
.mock .ms span{padding:3px 5px;border-radius:5px;color:var(--ink-3)}
.mock .ms span.hl{background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 0 0 2px var(--gold)}
.mock .mm{padding:8px;display:grid;gap:5px;align-content:start}
.mock .mm i{display:block;height:8px;border-radius:4px;background:var(--line)}
.mock .mm .mb{justify-self:start;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-style:normal}
.mock .mm .mb.hl{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-fg);box-shadow:0 0 0 2px var(--gold)}
.gnav{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.dots{display:flex;gap:5px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.warnbox{background:var(--gold-soft);border-radius:10px;padding:10px 12px;font-size:.85rem}

/* lock overlay */
.lockwrap{position:relative;border-radius:var(--r);overflow:hidden}
.lockwrap .blur{filter:blur(4px);pointer-events:none;user-select:none;opacity:.7}
.lockbox{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:linear-gradient(to bottom,rgba(248,250,252,.2),rgba(248,250,252,.85))}
:root[data-theme="dark"] .lockbox{background:linear-gradient(to bottom,rgba(15,23,42,.2),rgba(15,23,42,.88))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lockbox{background:linear-gradient(to bottom,rgba(15,23,42,.2),rgba(15,23,42,.88))}}
.lockcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;max-width:380px;text-align:center;display:grid;gap:8px;box-shadow:var(--shadow);justify-items:center}
.lockcard .lk{width:46px;height:46px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center}
.lockcard .lk svg{width:24px;height:24px}

/* content */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:6px;align-content:start;min-height:150px}
.day .d{font-size:.78rem;color:var(--ink-3);font-weight:600}
.day .idea{font-size:.85rem;font-weight:600}
.day.today{border-color:var(--accent-fg)}
.caption{background:var(--surface-2);border-radius:12px;padding:12px;white-space:pre-line;font-size:.92rem}

/* social */
.acct{display:flex;gap:12px;align-items:center}
.acct .lg{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700}
.meter{display:grid;gap:4px}

/* plans */
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:680px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:center;font-size:.9rem}
th:first-child,td:first-child{text-align:start}
thead th{background:var(--surface-2);vertical-align:top}
thead th.cur{background:var(--mint)}
td.cur{background:rgba(16,185,129,.05)}
.yes{color:var(--good);font-weight:700} .no{color:var(--ink-3)}
.ph b{display:block;font-size:1rem} .ph .pr{font-size:1.35rem;font-weight:700;color:var(--accent-fg)} .ph small{color:var(--ink-3);font-size:.75rem}

.tl{display:grid;gap:0}
.tl-i{display:grid;grid-template-columns:80px 30px 1fr;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:start}
.tl-i:last-child{border-bottom:0}
.tl-i .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.tl-i .ic svg{width:15px;height:15px}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:12px;font-weight:600;z-index:80;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.mnav{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .mnav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
  .mnav button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;white-space:nowrap;font-size:.85rem}
  .mnav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-fg)}
  .top,.content{padding-inline:16px}
  .grid2,.grid3{grid-template-columns:1fr}
  .cal{grid-template-columns:repeat(2,1fr)}
  .gstep{grid-template-columns:1fr}
  .level{grid-template-columns:1fr;justify-items:start}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.theme-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-grid;place-items:center;cursor:pointer;flex:none}
.theme-btn:hover{border-color:var(--accent-fg)}
.theme-btn svg{width:19px;height:19px}
/* ---- v2 additions ---- */
.go-link{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:.82rem;font-weight:600;color:var(--accent-fg);white-space:nowrap}
.go-link:hover{border-color:var(--accent)}
.go-link svg{width:14px;height:14px}
a.btn{text-decoration:none;display:inline-flex;align-items:center;gap:6px;color:inherit}
a.btn svg{width:15px;height:15px}
.salla-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-top:1px solid var(--line);background:var(--surface-2)}
.path{font-size:.82rem;background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:3px 8px}
.verify{display:flex;gap:10px;align-items:center;background:var(--mint);border-radius:12px;padding:10px 12px;font-size:.9rem}
.verify svg{width:20px;height:20px;color:var(--accent-fg);flex:none}

.score{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.factors{display:grid;gap:8px}
.factor{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;font-size:.88rem}
.factor .bar{height:8px}
.factor b{text-align:end;font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-columns:62px repeat(4,1fr);gap:4px;font-size:.78rem}
.heat .hd{color:var(--ink-3);text-align:center;font-weight:600}
.heat .dl{color:var(--ink-2);font-weight:600;align-self:center}
.heat .c{height:30px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:.75rem}
.legend{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--ink-3)}
.legend i{width:18px;height:10px;border-radius:3px;display:inline-block}
.mix{display:grid;grid-template-columns:70px 1fr 90px;gap:10px;align-items:center;padding:6px 0;font-size:.88rem}
.mix .track{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.mix .fill{height:100%;background:var(--accent);border-radius:4px}
.mix b{text-align:end;font-variant-numeric:tabular-nums}
.check{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:.9rem}
.check .ok{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:2px}
.check .ok svg{width:12px;height:12px}
.act{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.act:last-child{border-bottom:0}
.act .n{width:30px;height:30px;border-radius:50%;background:var(--gold-fill);color:#0F172A;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.post{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.post:last-child{border-bottom:0}
.post .th{width:54px;height:54px;border-radius:10px;background:linear-gradient(135deg,#D8C6AE,#A88B69)}
.simple-note{background:var(--gold-soft);border-radius:12px;padding:12px 14px;display:grid;gap:8px}

/* chat */
.chat-fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:20px;z-index:60;display:flex;align-items:center;gap:8px;background:var(--ad-bg);color:var(--ad-ink);border:1px solid var(--line);border-radius:99px;padding:10px 16px 10px 12px;font-weight:700;box-shadow:0 8px 24px rgba(15,23,42,.25)}
.chat-fab .dot{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#0F172A;display:grid;place-items:center}
.chat-fab .dot svg{width:17px;height:17px}
.chat{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:20px;z-index:70;width:min(380px,calc(100vw - 32px));height:min(600px,calc(100vh - 40px));background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 48px rgba(15,23,42,.3);display:flex;flex-direction:column;overflow:hidden}

.chat-h .dot{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#0F172A;display:grid;place-items:center}
.chat-h .dot svg{width:19px;height:19px}
.chat-h small{display:block;opacity:.75;font-size:.75rem}
.chat-h button{margin-inline-start:auto;border:0;background:none;color:inherit;width:30px;height:30px;display:grid;place-items:center}
.chat-h button svg{width:18px;height:18px}
.chat-b{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--ground)}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;font-size:.9rem;white-space:pre-line}
.msg.bot{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-start-start-radius:4px}
.msg.me{background:var(--accent);color:#0F172A;align-self:flex-end;border-start-end-radius:4px;font-weight:600}
.msg .up{margin-top:8px;background:var(--gold-soft);border-radius:10px;padding:8px 10px;font-size:.84rem;white-space:normal}
.msg .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.msg .src{margin-top:6px;font-size:.72rem;color:var(--ink-3)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--line);background:var(--surface)}
.chips button{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:4px 10px;font-size:.8rem}
.chat-f{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface)}
.chat-f input{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-width:0}
.typing{display:flex;gap:4px;padding:12px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.3}50%{opacity:1}}

#overlay .scrim{z-index:80}
.toast{z-index:95}

/* ================= STATE ================= */
let S={orders:6,plan:'basic',done:new Set(),adHidden:false,view:'home'};
function curLevel(){const o=S.orders;if(o<1)return LEVELS[0];for(let i=LEVELS.length-1;i>=1;i--){if(o>=LEVELS[i].from)return LEVELS[i]}return LEVELS[1]}
function seedDone(){S.done=new Set();const L=curLevel();LEVELS.forEach(l=>{if(l.n<L.n)l.tasks.forEach(t=>S.done.add(t.id));if(l.n===L.n)l.tasks.slice(0,Math.floor(l.tasks.length/2)).forEach(t=>S.done.add(t.id))})}
const planAt=id=>RANK[S.plan]>=RANK[id];
const planName=id=>PLANS.find(p=>p.id===id).name;
const planPrice=id=>PLANS.find(p=>p.id===id).price;
const allTasks=()=>LEVELS.flatMap(l=>l.tasks);
function totalPts(){let s=0;allTasks().forEach(t=>{if(S.done.has(t.id))s+=t.pts});return s}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
const goLink=(view,label)=>`<button class="go-link" data-go="${view}">${esc(label)}<svg><use href="#arrow"/></svg></button>`;

const VNAME=Object.fromEntries(VIEWS.map(v=>[v[0],v[1]]));
function nav(){
  $('#nav').innerHTML=VIEWS.map(([id,l,ic,req,grp])=>`${grp?`<div class="grp">${grp}</div>`:''}<button data-go="${id}" ${S.view===id?'aria-current="page"':''}><svg><use href="#${ic}"/></svg>${l}${req&&!planAt(req)?'<svg class="lock"><use href="#lock"/></svg>':''}</button>`).join('');
  $('#mnav').innerHTML=VIEWS.map(([id,l])=>`<button data-go="${id}" ${S.view===id?'aria-current="page"':''}>${l}</button>`).join('');
  $('#plan-name').textContent=planName(S.plan);
}
function go(id){S.view=id;document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+id));nav();render(id);window.scrollTo({top:0});try{history.replaceState(null,'','#'+id)}catch(e){}}
function render(id){({home:rHome,journey:rJourney,content:rContent,social:rSocial,mplan:rMplan,monitor:rMonitor,smart:rSmart,plans:rPlans})[id]()}

function adHTML(){
  const a=ADS[S.plan];if(!a||S.adHidden)return '';
  return `<aside class="ad" aria-label="إعلان باقة"><button class="x" data-hidead aria-label="سكّر الإعلان"><svg><use href="#x"/></svg></button><div class="ic"><svg><use href="#crown"/></svg></div><div class="tx"><span class="tag">${a.tag}</span><b>${a.title}</b><span style="font-size:.85rem;opacity:.9">${a.sub}</span></div><button class="btn" data-upgrade="${a.to}">اعرف أكثر</button></aside>`;
}
function lockHTML(req,inner,title,desc){
  return `<div class="lockwrap"><div class="blur" aria-hidden="true">${inner}</div><div class="lockbox"><div class="lockcard"><div class="lk"><svg><use href="#lock"/></svg></div><h3>${title}</h3><p class="muted" style="font-size:.9rem">${desc}</p><span class="chip c-market">موجودة في باقة ${planName(req)} (${planPrice(req)} ريال)</span><button class="btn primary" data-upgrade="${req}">رقّ لباقة ${planName(req)}</button></div></div></div>`;
}

/* ================= HOME ================= */
function rHome(){
  const L=curLevel();const next=L.n<7?LEVELS[L.n]:null;
  const done=L.tasks.filter(t=>S.done.has(t.id)).length,tot=L.tasks.length;
  const prog=L.n===1?0:Math.min(1,(S.orders-L.from)/(L.to-L.from));
  const nextTask=L.tasks.find(t=>!S.done.has(t.id));
  const C=2*Math.PI*46, off=C*(1-done/tot);
  $('#v-home').innerHTML=`
   <div><h1>هلا والله أبو فهد 👋</h1><p class="muted">أنت في المرحلة ${L.n} من 7. كل مرحلة فيها مهام بسيطة، خلّصها وتنتقل للي بعدها.</p></div>
   ${adHTML()}
   <div class="grid2">
    <div class="card level">
      <div class="ring"><svg viewBox="0 0 108 108"><circle cx="54" cy="54" r="46" fill="none" stroke="var(--surface-2)" stroke-width="10"/><circle cx="54" cy="54" r="46" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg><div class="in"><div><b class="num">${done}/${tot}</b><div class="faint">مهام</div></div></div></div>
      <div style="display:grid;gap:8px;width:100%">
        <span class="chip c-ops" style="justify-self:start">المرحلة ${L.n}</span>
        <h2>${L.name}</h2><p class="muted">${L.goal}</p>
        ${L.n>1?`<div><div class="row between faint"><span>طلباتك: <b class="num" style="color:var(--ink)">${S.orders}</b></span><span>الهدف: ${L.to} طلب</span></div><div class="bar"><i style="width:${Math.round(prog*100)}%"></i></div></div>`:`<p class="faint">المرحلة تخلص مع أول طلب يوصلك.</p>`}
      </div>
    </div>
    <div class="card" style="display:grid;gap:10px">
      <div class="grid3" style="grid-template-columns:1fr 1fr">
        <div class="stat"><span>نقاطك</span><b class="num" style="color:var(--gold)">${totalPts()}</b></div>
        <div class="stat"><span>مهام خلّصتها</span><b class="num">${S.done.size}</b></div>
      </div>
      <p class="faint">النقاط توريك وين وصلت في التعلّم. والانتقال للمرحلة الجاية يكون بعدد طلباتك الحقيقي من سلة، مع إنك تخلّص المهام الأساسية.</p>
      ${next?`<p style="font-size:.9rem">المرحلة الجاية: <b>${next.name}</b></p>`:''}
    </div>
   </div>
   ${nextTask?`<div class="card next" style="display:grid;gap:10px">
     <div class="row between"><span class="chip c-ops">مهمتك الجاية</span><span class="pts">+${nextTask.pts} نقطة</span></div>
     <h2>${esc(nextTask.t)}</h2>
     <p class="muted"><b style="color:var(--ink)">ليش مهمة؟</b> ${esc(nextTask.why)}</p>
     <div class="row"><button class="btn primary" data-task="${nextTask.id}">يلا نبدأ</button>${nextTask.guide?`<span class="faint">فيها دليل سلة خطوة بخطوة</span>`:''}</div>
   </div>`:`<div class="card next"><h2>يعطيك العافية! خلّصت كل مهام هالمرحلة</h2><p class="muted">تنتقل للمرحلة الجاية أول ما توصل طلباتك للهدف.</p></div>`}
   <div class="card"><div class="row between" style="margin-bottom:8px"><h2>باقي مهام المرحلة</h2><button class="btn ghost sm" data-go="journey">شوف الرحلة كاملة</button></div>${L.tasks.map(taskRow).join('')}</div>`;
}
function taskRow(t){
  const d=S.done.has(t.id);const locked=t.premium&&!planAt(t.premium);
  return `<div class="task ${d?'done':''}"><button class="tick" data-toggle="${t.id}" aria-label="${d?'رجّعها ما خلصت':'خلصت'}"><svg><use href="#check"/></svg></button>
   <div style="display:grid;gap:3px"><button class="tt" data-task="${t.id}">${esc(t.t)}</button><div class="row" style="gap:6px"><span class="chip ${CAT[t.cat][1]}">${CAT[t.cat][0]}</span>${t.guide?`<span class="chip">دليل سلة</span>`:''}${t.auto?`<span class="chip" title="نبض يتأكد منها من سلة لحاله"><svg><use href="#auto"/></svg>نبض يتأكد منها</span>`:''}${locked?`<span class="chip c-market"><svg><use href="#lock"/></svg>${planName(t.premium)}</span>`:''}</div></div>
   <span class="pts">+${t.pts}</span></div>`;
}

/* ================= JOURNEY ================= */
let openStage=null;

  const L=curLevel();if(openStage===null)openStage=L.n;
  $('#v-journey').innerHTML=`<div><h1>رحلتي</h1><p class="muted">7 مراحل من متجر جديد لين متجر محترف. كل مرحلة لها هدف بعدد الطلبات، ومهام وكل مهمة معها شرح.</p></div>
  <div class="stages">${LEVELS.map(l=>{
    const st=l.n<L.n?'done':l.n===L.n?'cur':'locked';const d=l.tasks.filter(t=>S.done.has(t.id)).length;

    return `<div class="stage ${st}"><button class="stage-h" data-stage="${l.n}" aria-expanded="${openStage===l.n}"><span class="st-n">${st==='done'?'<svg><use href="#check"/></svg>':l.n}</span><span><b>${l.name}</b><div class="faint">${l.goal}</div></span><span class="faint num">${d}/${l.tasks.length}${freeLock?' · <svg style="width:14px;height:14px;vertical-align:-2px"><use href="#lock"/></svg>':''}</span></button>
    ${openStage===l.n?`<div class="stage-b">${freeLock?`<div class="warnbox" style="margin-top:8px">المراحل من 3 لين 7 تفتح لك من الباقة الأساسية (59 ريال). <button class="btn ghost sm" data-upgrade="basic">رقّ باقتك</button></div>`:l.tasks.map(taskRow).join('')}</div>`:''}</div>`}).join('')}</div>`;

   ['رحلة التاجر: المراحل والمهام والشرح',['المرحلة 1 و2','كل المراحل','كل المراحل','كل المراحل']],
   ['النقاط والشارات',[1,1,1,1]],
   ['أدلة سلة خطوة بخطوة + التأكد من سلة',['3 أدلة','كل الأدلة','كل الأدلة','كل الأدلة']],
   ['«سوّها لي» بدالك في سلة (كوبونات وعروض)',[0,0,1,1]],
   ['مساعد نبض (اسأل نبض)',['إجابات مختصرة','إجابات مختصرة + أدلة','إجابات كاملة بأرقامك','كاملة + تحويل لخبير']],
   ['صانع المحتوى',[0,'20 منشور بالشهر','60 منشور بالشهر','بلا حد']],
   ['تقويم المحتوى والمواسم',[0,1,1,1]],
   ['تحليل السوشيال ميديا',['تحليل مختصر','تحليل مختصر','تحليل كامل + خطة تنشيط','تحليل كامل + خطة تنشيط']],
   ['الخطة التسويقية الشهرية',['أول أسبوع','أول أسبوع',1,1]],
   ['مراقبة تغييرات المتجر',[0,0,1,1]],
   ['نبض الذكي: الفرص والتجارب (من 100 طلب)',[0,0,1,1]],
   ['التقرير الأسبوعي',[0,1,1,1]],
   ['تنبيهات يومية على الجوال',[0,0,0,1]],
   ['جلسة شهرية مع خبير نمو',[0,0,0,1]],
   ['أعضاء الفريق',['1','1','3','10']]
  ];
  const cell=(v,i)=>`<td class="${PLANS[i].id===S.plan?'cur':''}">${v===1?'<span class="yes">✓</span>':v===0?'<span class="no">—</span>':esc(v)}</td>`;
  $('#v-plans').innerHTML=`<div><h1>الباقات</h1><p class="muted">كل باقة تضيف لك أدوات جديدة. ابدأ ببلاش ورقّ باقتك لما يكبر متجرك.</p></div>
  <div class="tbl"><table><thead><tr><th>الميزة</th>${PLANS.map(p=>`<th class="ph ${p.id===S.plan?'cur':''}"><b>${p.name}</b><span class="pr num">${p.price}</span> <small>ريال بالشهر</small><div style="margin-top:6px">${p.id===S.plan?'<span class="chip c-ops">باقتك الحين</span>':RANK[p.id]>RANK[S.plan]?`<button class="btn sm primary" data-setplan="${p.id}">رقّ لها</button>`:''}</div></th>`).join('')}</tr></thead>
  <tbody>${rows.map(r=>`<tr><td>${r[0]}</td>${r[1].map(cell).join('')}</tr>`).join('')}</tbody></table></div>
  <p class="faint">الاشتراك عن طريق متجر تطبيقات سلة.</p>`;
}

/* ================= CHAT ================= */
/* Each intent: full answer (needs plan `need`), simple answer for lower plans, and where to go. */
function nextTaskTitle(){const L=curLevel();const t=L.tasks.find(x=>!S.done.has(x.id));return t?`«${t.t}» في المرحلة ${L.n} (${L.name})`:'خلّصت مهام مرحلتك، وتنتقل لما توصل طلباتك للهدف'}
const INTENTS=[
 {id:'task',keys:['مهمت','وش اسوي','ايش اسوي','وش أسوي','ابدأ','أبدأ','وش الخطوة'],need:'free',
  full:()=>`مهمتك الجاية: ${nextTaskTitle()}.\nخلّصها وتاخذ نقاطها، وكل ما خلصت مهام تقرّب من المرحلة الجاية.`,go:['home','افتح مهمتك']},
 {id:'coupon',keys:['كوبون','خصم','كود'],need:'basic',
  full:()=>'تسوي الكوبون من لوحة سلة: التسويق ← كوبونات التخفيض ← إضافة كوبون.\nحط الكود (مثل WELCOME10)، ونوع الخصم نسبة 10%، وتاريخ انتهاء، ومرة وحدة لكل عميل، واحفظ.\nوبعدها نبض يتأكد من سلة إنه انضاف.',
  simple:()=>'تسويه من لوحة سلة في قسم التسويق، وتحدد الكود ونسبة الخصم وتاريخ الانتهاء.',up:'الدليل المصوّر خطوة بخطوة وتأكد نبض من سلة',go:['journey','مهمة الكوبون']},
 {id:'sales',keys:['مبيعات','نزل','نزلت','قلّت','قلت','ليش ما','ما يبيع','ضعيف'],need:'growth',
  full:()=>S.orders>=100?'حسب بيانات متجرك: التراجع من «عطر الورد الطائفي» بعد ما رفعت سعره من 189 لـ 229 ريال في 2 سبتمبر (هذا مؤكد من السجل). المتجر كله شبه ثابت (−3%).\nأنصحك تجرّب سعر أقرب للقديم أو عرض على عبوتين لمدة أسبوعين، ونقيس النتيجة.':'متجرك لسه تحت 100 طلب، فأي نزول بسيط ممكن يكون طبيعي. من بياناتك: الزيارات من إنستقرام زينة (132 هالأسبوع) بس الشراء منها 3%. أغلبهم يدخلون «مسك الطهارة» ويطلعون.\nالأولوية: حسّن صفحة المنتج (صور أكثر ووصف واضح)، وانتظم في النشر.',
  simple:()=>'أكثر الأسباب شيوعًا: قلة النشر، أو صفحات منتجات ضعيفة، أو تغيير في الأسعار، أو منتج خلص. راجع هالأشياء الأربعة أول.',up:'تحليل بأرقام متجرك يقولك السبب بالضبط والخطوة الجاية',go:['monitor','مراقبة المتجر']},
 {id:'followers',keys:['متابع','انستقرام','إنستقرام','تيك','سوشيال','أنشط','انشط','حسابي','تفاعل'],need:'growth',
  full:()=>'حسب تحليل حسابك: صحة الحساب 62 من 100.\n١. تنشر مرتين بالأسبوع، خلّها 4.\n٢. تنشر الظهر، ومتابعينك متواجدين الخميس والجمعة الساعة 9 بالليل.\n٣. الريلز يوصل 3 أضعاف الصور، فخلّ نص منشوراتك ريلز.\n٤. البايو ما يوضح وش تبيع.',
  simple:()=>'القاعدة العامة: انتظم (3 لين 4 منشورات بالأسبوع)، وركّز على الريلز، وانشر بالليل، وخلّ البايو يقول وش تبيع ومعه رابط المتجر.',up:'تحليل حسابك أنت: أفضل أوقاتك، ووش المحتوى اللي يجيب لك طلبات، وخطة تنشيط كل أسبوع',go:['social','السوشيال ميديا']},
 {id:'post',keys:['انشر','أنشر','منشور','محتوى','ريلز','ستوري','فكرة'],need:'basic',
  full:()=>'اليوم الأربعاء، وفكرة اليوم في تقويمك: «تجربة عميل حقيقية».\nصوّر رسالة أو تقييم من عميل (بعد إذنه) مع المنتج، وانشره ريلز بالليل. النص الجاهز تلقاه في صانع المحتوى.',
  simple:()=>'فكرة سهلة: صوّر وأنت تغلّف طلب وانشره ريلز. هذا النوع يمشي زين مع المتاجر الجديدة.',up:'تقويم محتوى كامل كل أسبوع مع نصوص جاهزة',go:['content','صانع المحتوى']},
 {id:'mplan',keys:['خطة','تسويق','اعلان','إعلان','حملة','راتب','موسم'],need:'growth',
  full:()=>'خطتك لأكتوبر: الأسبوع الأول تعريف بمنتجاتك، والثاني حملة يوم الراتب (27 أكتوبر) بكوبون 10% لـ 3 أيام وإعلان سناب بـ 300 ريال، والثالث تقييمات ومؤثر صغير، والرابع استعداد للجمعة البيضاء.\nالميزانية المقترحة من 500 لين 800 ريال.',
  simple:()=>'أهم موسم قريب: يوم الراتب 27 أكتوبر. جهّز كوبون لـ 3 أيام، وانشر عنه قبلها بيومين.',up:'خطة تسويقية شهرية كاملة: وش تنشر، ووش تعلن، وكم تصرف',go:['mplan','الخطة التسويقية']},
 {id:'ship',keys:['شحن','توصيل'],need:'basic',
  full:()=>'من طلباتك: فيه طلبات كثير بين 150 و199 ريال. حط حد الشحن المجاني 229 ريال، وخلّ شريط في المتجر يقول «باقي لك كذا وتاخذ شحن مجاني». بعدها نقيس متوسط الطلب لمدة أسبوعين.',
  simple:()=>'حد الشحن المجاني يكون فوق متوسط طلباتك بشوي، عشان العميل يضيف منتج ويوصل له.',up:'اقتراح الحد المناسب من طلبات متجرك ودليل ضبطه في سلة',go:['journey','مهمة الشحن المجاني']},
 {id:'expert',keys:['خبير','استشارة','أكلم','اكلم','جلسة'],need:'pro',
  full:()=>'تقدر تحجز جلستك الشهرية مع خبير نمو من هنا، ونبض يجهز له أرقامك وخطتك قبل الجلسة.',
  simple:()=>'أقدر أساعدك هنا بالإجابات والأدلة. الجلسة مع خبير نمو موجودة في الباقة الاحترافية.',up:'جلسة شهرية مع خبير يراجع أرقامك ويبني خطتك معك',go:['plans','الباقات']}
];
let chatOpen=false,chatLog=[];
function findIntent(q){q=q.replace(/[أإآ]/g,'ا');return INTENTS.find(it=>it.keys.some(k=>q.includes(k.replace(/[أإآ]/g,'ا'))))}
function answer(q){
  const it=findIntent(q);
  if(!it)return {text:'ما فهمت عليك زين 🙏 جرّب تسألني عن: مهمتك الجاية، الكوبون، المبيعات، السوشيال، وش تنشر اليوم، الشحن، أو الخطة التسويقية.',src:null};
  if(planAt(it.need))return {text:it.full(),go:it.go,src:'من بيانات متجرك في سلة ونبض'};
  return {text:it.simple(),go:it.go,up:{plan:it.need,what:it.up},src:'إجابة عامة، مو من أرقام متجرك'};
}
function renderChat(){
  if(!chatOpen){$('#chat-root').innerHTML='';$('#chat-fab').hidden=false;return}
  $('#chat-fab').hidden=true;
  $('#chat-root').innerHTML=`<section class="chat" role="dialog" aria-label="مساعد نبض">
   <div class="chat-h"><span class="dot"><svg><use href="#pulse"/></svg></span><div><b>مساعد نبض</b><small>يجاوبك من بيانات متجرك · باقتك: ${planName(S.plan)}</small></div><button data-chatclose aria-label="سكّر المحادثة"><svg><use href="#x"/></svg></button></div>
   <div class="chat-b" id="chat-b">${chatLog.map(m=>msgHTML(m)).join('')}</div>
   <div class="chips">${['وش مهمتي الحين؟','كيف أسوي كوبون؟','ليش مبيعاتي نزلت؟','كيف أنشّط حسابي؟','وش أنشر اليوم؟'].map(c=>`<button data-ask="${c}">${c}</button>`).join('')}</div>
   <form class="chat-f" id="chat-form"><input id="chat-in" placeholder="اسأل نبض أي شي عن متجرك..." aria-label="سؤالك" autocomplete="off"><button class="btn primary sm" type="submit" aria-label="أرسل"><svg style="width:16px;height:16px;vertical-align:-3px"><use href="#send"/></svg></button></form>
  </section>`;
  const b=$('#chat-b');b.scrollTop=b.scrollHeight;
}
function msgHTML(m){
  if(m.typing)return `<div class="msg bot typing" aria-label="نبض يكتب"><i></i><i></i><i></i></div>`;
  if(m.me)return `<div class="msg me">${esc(m.text)}</div>`;
  return `<div class="msg bot">${esc(m.text)}${m.up?`<div class="up"><b>هذي إجابة مختصرة.</b> إذا تبي إجابة بمسار أوضح (${esc(m.up.what)})، اشترك في باقة ${planName(m.up.plan)} (${planPrice(m.up.plan)} ريال) وتفتح لك هالميزة.<div class="acts"><button class="btn sm primary" data-upgrade="${m.up.plan}">شوف باقة ${planName(m.up.plan)}</button></div></div>`:''}${m.go?`<div class="acts">${goLink(m.go[0],m.go[1])}</div>`:''}${m.src?`<div class="src">${esc(m.src)}</div>`:''}</div>`;
}
function ask(q){
  q=q.trim();if(!q)return;
  chatLog.push({me:true,text:q});chatLog.push({typing:true});renderChat();
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(()=>{chatLog=chatLog.filter(m=>!m.typing);chatLog.push(answer(q));renderChat();const i=$('#chat-in');if(i)i.focus()},reduce?50:700);
}
function openChat(){chatOpen=true;if(!chatLog.length)chatLog.push({text:`هلا أبو فهد 👋 أنا مساعد نبض.\nاسألني عن متجرك، أو اختر سؤال من تحت.`,src:null});renderChat();const i=$('#chat-in');if(i)i.focus()}

/* ================= EVENTS ================= */
const close=()=>{$('#overlay').innerHTML=''};
function complete(id,msg){if(S.done.has(id))return;S.done.add(id);const t=allTasks().find(x=>x.id===id);toast(msg||`كفو! +${t.pts} نقطة`);render(S.view)}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-theme-toggle]'))return;
  const t=e.target.closest('button,[data-close]');if(!t)return;
  if(t.classList.contains('scrim')&&e.target!==t)return;
  const d=t.dataset;
  if(t.id==='chat-fab'){openChat();return}
  if(d.chatclose!==undefined){chatOpen=false;renderChat();return}
  if(d.ask){ask(d.ask);return}
  if(d.go){close();if(chatOpen&&window.innerWidth<700){chatOpen=false;renderChat()}go(d.go)}
  else if(d.task)taskDrawer(d.task);
  else if(d.toggle){if(S.done.has(d.toggle)){S.done.delete(d.toggle);render(S.view)}else complete(d.toggle)}
  else if(d.complete){complete(d.complete);taskDrawer(d.complete)}
  else if(d.verify){const tk=allTasks().find(x=>x.id===d.verify);const g=tk.guide?GUIDES[tk.guide]:null;t.disabled=true;t.textContent='نبض يتأكد من سلة...';setTimeout(()=>{complete(tk.id,g?`تأكدنا من سلة: ${g.found} ✓ (+${tk.pts} نقطة)`:`تأكدنا من سلة ✓ (+${tk.pts} نقطة)`);taskDrawer(tk.id)},900)}
  else if(d.stage){const n=+d.stage;openStage=openStage===n?-1:n;rJourney()}
  else if(d.gnext!==undefined||d.gprev!==undefined){const key=$('#guide').dataset.g;gi=Math.max(0,Math.min(GUIDES[key].steps.length-1,gi+(d.gnext!==undefined?1:-1)));$('#guide').outerHTML=guideHTML(key)}
  else if(d.doit){toast('سوّينا كوبون WELCOME10 في متجرك على سلة (معاينة)');if(curTask)complete(curTask);if(curTask)taskDrawer(curTask)}
  else if(d.fake)toast(d.fake);
  else if(d.upgrade){close();go('plans')}
  else if(d.setplan){S.plan=d.setplan;$('#demo-plan').value=S.plan;S.adHidden=false;toast('رقّينا باقتك لـ '+planName(S.plan)+' (معاينة)');nav();rPlans();if(chatOpen)renderChat()}
  else if(d.hidead!==undefined){S.adHidden=true;render(S.view)}
  else if(d.caption){const c=CAPTIONS[+d.caption];$('#cap-out').innerHTML=`<div class="row between" style="margin-bottom:8px"><h3>منشورك جاهز</h3><button class="btn sm" data-copy="${+d.caption}"><svg style="width:15px;height:15px;vertical-align:-2px"><use href="#copy"/></svg> انسخ</button></div><div class="caption">${esc(c)}</div><p class="faint" style="margin-top:6px">راجع النص قبل ما تنشر، وعدّله على أسلوبك.</p>`}
  else if(d.copy!==undefined){const txt=CAPTIONS[+d.copy];try{navigator.clipboard.writeText(txt).then(()=>toast('انسخ النص ✓'),()=>toast('ظلّل النص وانسخه بيدك'))}catch(err){toast('ظلّل النص وانسخه بيدك')}}
  else if(d.close!==undefined)close();
});
document.addEventListener('submit',e=>{if(e.target.id==='chat-form'){e.preventDefault();const i=$('#chat-in');const v=i.value;i.value='';ask(v)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#overlay').innerHTML)close();else if(chatOpen){chatOpen=false;renderChat()}}});
document.addEventListener('change',e=>{
  if(e.target.id==='demo-orders'){S.orders=+e.target.value;openStage=null;seedDone();render(S.view)}
  if(e.target.id==='demo-plan'){S.plan=e.target.value;S.adHidden=false;nav();render(S.view);if(chatOpen)renderChat()}
});

seedDone();
const h=(location.hash||'').slice(1);
go(VIEWS.some(v=>v[0]===h)?h:'home');
})();
</script>

<script>
(function(){
  var r=document.documentElement;
  var moon='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  var sun='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.9"/><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  function cur(){var t=r.getAttribute('data-theme');if(t)return t;try{return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}catch(e){return 'light'}}
  function paint(){var d=cur()==='dark';document.querySelectorAll('[data-theme-toggle]').forEach(function(b){b.innerHTML=d?sun:moon;b.setAttribute('aria-label',d?'الوضع الفاتح':'الوضع الداكن');b.title=d?'الوضع الفاتح':'الوضع الداكن'})}
  try{var s=localStorage.getItem('nabd-theme');if(s==='dark'||s==='light')r.setAttribute('data-theme',s)}catch(e){}
  document.addEventListener('click',function(e){var b=e.target.closest('[data-theme-toggle]');if(!b)return;var n=cur()==='dark'?'light':'dark';r.setAttribute('data-theme',n);try{localStorage.setItem('nabd-theme',n)}catch(err){}paint()});
  paint();
})();
</script>
