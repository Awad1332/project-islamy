<title>نبض — رحلة التاجر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F5F7F8; --surface:#FFFFFF; --surface-2:#F2F5F4; --line:#E3E8E6;
  --ink:#15232A; --ink-2:#4C5B61; --ink-3:#86949A;
  --accent:#0F6E5C; --accent-2:#138A73; --accent-ink:#FFFFFF; --mint:#DDF4EC; --mint-2:#BDEBDB;
  --gold:#B7791F; --gold-soft:#FBF0DC;
  --good:#1F8A4C; --good-soft:#E1F4E8;
  --bad:#C0392B; --bad-soft:#FBE4E1;
  --info:#2F62B0; --info-soft:#E4ECF9;
  --shadow:0 1px 2px rgba(21,35,42,.05),0 4px 16px rgba(21,35,42,.05);
  --r:14px;
  --f:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0E1517; --surface:#151F22; --surface-2:#1B272A; --line:#283538;
    --ink:#E6EEF0; --ink-2:#A8B7BC; --ink-3:#7C8B90;
    --accent:#4FC3A6; --accent-2:#6ED3B8; --accent-ink:#08201A; --mint:#173A32; --mint-2:#1F4B41;
    --gold:#E7B55A; --gold-soft:#3A2D14;
    --good:#6FCF97; --good-soft:#17352A;
    --bad:#F28B7E; --bad-soft:#3E1F1C;
    --info:#8FAEEA; --info-soft:#1C2842;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E1517; --surface:#151F22; --surface-2:#1B272A; --line:#283538;
  --ink:#E6EEF0; --ink-2:#A8B7BC; --ink-3:#7C8B90;
  --accent:#4FC3A6; --accent-2:#6ED3B8; --accent-ink:#08201A; --mint:#173A32; --mint-2:#1F4B41;
  --gold:#E7B55A; --gold-soft:#3A2D14;
  --good:#6FCF97; --good-soft:#17352A;
  --bad:#F28B7E; --bad-soft:#3E1F1C;
  --info:#8FAEEA; --info-soft:#1C2842;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.7;direction:rtl}
h1,h2,h3{margin:0;line-height:1.4;text-wrap:balance}
h1{font-size:1.35rem;font-weight:700} h2{font-size:1.08rem;font-weight:700} h3{font-size:.98rem;font-weight:600}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--surface);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.mark svg{width:22px;height:22px}
.brand b{font-size:1.15rem;display:block;line-height:1.2}
.brand small{color:var(--ink-3);font-size:.75rem}
.nav{padding:10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav .grp{font-size:.72rem;color:var(--ink-3);font-weight:600;padding:10px 10px 4px}
.nav button{border:0;background:none;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink-2);text-align:start;font-weight:500}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="page"]{background:var(--mint);color:var(--accent);font-weight:700}
.nav svg{width:19px;height:19px;flex:none}
.nav .lock{margin-inline-start:auto;width:15px;height:15px;color:var(--ink-3)}
.side-foot{margin-top:auto;padding:14px;border-top:1px solid var(--line)}
.plan-pill{display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:.85rem}

.top{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.store{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--mint);color:var(--accent);display:grid;place-items:center;font-weight:700}
.demo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--gold-soft);border-radius:10px;padding:5px 10px;font-size:.8rem}
.demo select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:2px 6px;font-size:.8rem}
.main{min-width:0}
.content{padding:22px 24px 60px;max-width:1040px}
.view{display:none} .view.on{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3);font-size:.82rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 16px;font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.sm{padding:5px 12px;font-size:.85rem}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip svg{width:13px;height:13px}
.c-store{background:var(--info-soft);color:var(--info)}
.c-content{background:#F3E8FB;color:#7B3FA8}
.c-social{background:#FCE7EF;color:#B03664}
.c-market{background:var(--gold-soft);color:var(--gold)}
.c-ops{background:var(--mint);color:var(--accent)}
:root[data-theme="dark"] .c-content{background:#2C2138;color:#C9A2EA}
:root[data-theme="dark"] .c-social{background:#3A1E2A;color:#F29BBC}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .c-content{background:#2C2138;color:#C9A2EA}:root:not([data-theme="light"]) .c-social{background:#3A1E2A;color:#F29BBC}}

/* ad banner */
.ad{display:flex;gap:16px;align-items:center;background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden}
.ad::before{content:"";position:absolute;inset-inline-start:-30px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.08)}
.ad .ic{width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.ad .ic svg{width:26px;height:26px}
.ad .tx{flex:1;min-width:0;position:relative}
.ad .tag{font-size:.72rem;font-weight:700;opacity:.85}
.ad b{display:block;font-size:1.02rem}
.ad .btn{background:var(--surface);color:var(--accent);border-color:transparent;position:relative;white-space:nowrap}
.ad .x{position:absolute;top:6px;inset-inline-start:8px;border:0;background:none;color:inherit;opacity:.75;width:26px;height:26px;display:grid;place-items:center}
.ad .x svg{width:16px;height:16px}

/* level hero */
.level{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:108px;height:108px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.2}
.ring .in b{font-size:1.5rem}
.bar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stat span{display:block;font-size:.76rem;color:var(--ink-3)}
.stat b{font-size:1.2rem}
.next{border:2px solid var(--accent);background:var(--mint)}

/* journey */
.stages{display:flex;flex-direction:column;gap:10px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stage-h{width:100%;border:0;background:none;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:14px 16px;text-align:start}
.st-n{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--surface-2);color:var(--ink-3)}
.stage.done .st-n{background:var(--good);color:#fff}
.stage.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--mint)}
.stage.cur .st-n{background:var(--accent);color:var(--accent-ink)}
.stage.locked{opacity:.7}
.st-n svg{width:20px;height:20px}
.stage-b{border-top:1px solid var(--line);padding:6px 16px 14px}
.task{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.task:last-child{border-bottom:0}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--surface)}
.tick svg{width:14px;height:14px;color:#fff;opacity:0}
.task.done .tick{background:var(--good);border-color:var(--good)}
.task.done .tick svg{opacity:1}
.task.done .tt{color:var(--ink-3);text-decoration:line-through}
.task .tt{font-weight:600;border:0;background:none;padding:0;text-align:start;cursor:pointer}
.task .tt:hover{color:var(--accent)}
.pts{font-size:.8rem;font-weight:700;color:var(--gold);white-space:nowrap}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,22,.45);z-index:50;display:flex;justify-content:flex-start}
.drawer{background:var(--ground);width:min(560px,100%);height:100%;overflow:auto;display:flex;flex-direction:column}
.dr-h{background:var(--surface);padding:18px 20px;border-bottom:1px solid var(--line);display:grid;gap:8px;position:sticky;top:0;z-index:2}
.dr-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--mint);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.guide{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.guide-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--surface-2);gap:8px;flex-wrap:wrap}
.gstep{display:grid;grid-template-columns:1fr 1.1fr;gap:12px;padding:14px;align-items:center}
.mock{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--ground);font-size:.72rem;display:grid;grid-template-columns:1fr 70px;min-height:120px}
.mock .ms{background:var(--surface);border-inline-start:1px solid var(--line);padding:6px;display:grid;gap:3px;align-content:start}
.mock .ms span{padding:3px 5px;border-radius:5px;color:var(--ink-3)}
.mock .ms span.hl{background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 0 0 2px var(--gold)}
.mock .mm{padding:8px;display:grid;gap:5px;align-content:start}
.mock .mm i{display:block;height:8px;border-radius:4px;background:var(--line)}
.mock .mm .mb{justify-self:start;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-style:normal}
.mock .mm .mb.hl{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 0 0 2px var(--gold)}
.gnav{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.dots{display:flex;gap:5px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.warnbox{background:var(--gold-soft);border-radius:10px;padding:10px 12px;font-size:.85rem}

/* lock overlay */
.lockwrap{position:relative;border-radius:var(--r);overflow:hidden}
.lockwrap .blur{filter:blur(4px);pointer-events:none;user-select:none;opacity:.7}
.lockbox{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:linear-gradient(to bottom,rgba(245,247,248,.2),rgba(245,247,248,.85))}
:root[data-theme="dark"] .lockbox{background:linear-gradient(to bottom,rgba(14,21,23,.2),rgba(14,21,23,.88))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lockbox{background:linear-gradient(to bottom,rgba(14,21,23,.2),rgba(14,21,23,.88))}}
.lockcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;max-width:380px;text-align:center;display:grid;gap:8px;box-shadow:var(--shadow);justify-items:center}
.lockcard .lk{width:46px;height:46px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center}
.lockcard .lk svg{width:24px;height:24px}

/* content */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:6px;align-content:start;min-height:150px}
.day .d{font-size:.78rem;color:var(--ink-3);font-weight:600}
.day .idea{font-size:.85rem;font-weight:600}
.day.today{border-color:var(--accent)}
.caption{background:var(--surface-2);border-radius:12px;padding:12px;white-space:pre-line;font-size:.92rem}

/* social */
.acct{display:flex;gap:12px;align-items:center}
.acct .lg{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700}
.meter{display:grid;gap:4px}

/* plans */
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:680px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:center;font-size:.9rem}
th:first-child,td:first-child{text-align:start}
thead th{background:var(--surface-2);vertical-align:top}
thead th.cur{background:var(--mint)}
td.cur{background:rgba(15,110,92,.05)}
.yes{color:var(--good);font-weight:700} .no{color:var(--ink-3)}
.ph b{display:block;font-size:1rem} .ph .pr{font-size:1.35rem;font-weight:700;color:var(--accent)} .ph small{color:var(--ink-3);font-size:.75rem}

.tl{display:grid;gap:0}
.tl-i{display:grid;grid-template-columns:80px 30px 1fr;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:start}
.tl-i:last-child{border-bottom:0}
.tl-i .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.tl-i .ic svg{width:15px;height:15px}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:12px;font-weight:600;z-index:80;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.mnav{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .mnav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
  .mnav button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;white-space:nowrap;font-size:.85rem}
  .mnav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .top,.content{padding-inline:16px}
  .grid2,.grid3{grid-template-columns:1fr}
  .cal{grid-template-columns:repeat(2,1fr)}
  .gstep{grid-template-columns:1fr}
  .level{grid-template-columns:1fr;justify-items:start}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

  <symbol id="pulse" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M2 13h4l2-6 4 12 3-9 2 3h5"/></symbol>
  <symbol id="home" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>

  <symbol id="pen" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"/></symbol>

  <symbol id="crown" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/></symbol>
  <symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.8" d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></symbol>
  <symbol id="auto" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4"/></symbol>
  <symbol id="bag" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/></symbol>
  <symbol id="copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.8" d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></symbol>
  <symbol id="spark" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></symbol>

/* ================= STATE ================= */
let S={orders:6,plan:'basic',done:new Set(),adHidden:false,view:'home',cal:0};
function levelOf(o){for(let i=LEVELS.length-1;i>=0;i--){if(o>=LEVELS[i].from&&(i===0?o<1:true)&&o>=LEVELS[i].from)return LEVELS[i]}return LEVELS[0]}
function curLevel(){const o=S.orders;if(o<1)return LEVELS[0];for(let i=LEVELS.length-1;i>=1;i--){if(o>=LEVELS[i].from)return LEVELS[i]}return LEVELS[1]}
function seedDone(){S.done=new Set();const L=curLevel();LEVELS.forEach(l=>{if(l.n<L.n)l.tasks.forEach(t=>S.done.add(t.id));if(l.n===L.n)l.tasks.slice(0,Math.floor(l.tasks.length/2)).forEach(t=>S.done.add(t.id))})}
const planAt=id=>RANK[S.plan]>=RANK[id];
const planName=id=>PLANS.find(p=>p.id===id).name;
function totalPts(){let s=0;LEVELS.forEach(l=>l.tasks.forEach(t=>{if(S.done.has(t.id))s+=t.pts}));return s}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

function adHTML(){
  const a=ADS[S.plan];if(!a||S.adHidden)return '';
  return `<aside class="ad" aria-label="إعلان باقة"><button class="x" data-hidead aria-label="إخفاء الإعلان"><svg><use href="#x"/></svg></button><div class="ic"><svg><use href="#crown"/></svg></div><div class="tx"><span class="tag">${a.tag}</span><b>${a.title}</b><span style="font-size:.85rem;opacity:.9">${a.sub}</span></div><button class="btn" data-upgrade="${a.to}">اعرف أكثر</button></aside>`;

function lockHTML(req,inner,title,desc){
  return `<div class="lockwrap"><div class="blur" aria-hidden="true">${inner}</div><div class="lockbox"><div class="lockcard"><div class="lk"><svg><use href="#lock"/></svg></div><h3>${title}</h3><p class="muted" style="font-size:.9rem">${desc}</p><span class="chip c-market">متاحة في باقة ${planName(req)}</span><button class="btn primary" data-upgrade="${req}">ترقية إلى ${planName(req)}</button></div></div></div>`;

  $('#v-home').innerHTML=`
   <div class="row between"><div><h1>هلا أبو فهد 👋</h1><p class="muted">أنت في المرحلة ${L.n} من 7. كل مرحلة فيها مهام بسيطة، كمّلها وتنتقل للي بعدها.</p></div></div>

    </div>

function taskRow(t){

function guideHTML(key){
  const g=GUIDES[key];const allowed=planAt('basic')||FREE_GUIDES.includes(key);
  if(!allowed)return lockHTML('basic',`<div class="guide"><div class="guide-h"><b>${g.title}</b></div><div class="gstep"><div>خطوات مصورة داخل لوحة سلة</div>${mock(g.steps[0])}</div></div>`,'دليل سلة خطوة بخطوة','نوريك وين تضغط بالضبط في لوحة سلة، خطوة بخطوة.');
  const st=g.steps[gi];
  return `<div class="guide" id="guide" data-g="${key}"><div class="guide-h"><b>دليل سلة: ${g.title}</b><span class="faint num">الخطوة ${gi+1} من ${g.steps.length}</span></div>
   <div class="gstep"><p style="font-weight:600">${esc(st.t)}</p>${mock(st)}</div>
   <div class="gnav"><button class="btn sm" data-gprev ${gi===0?'disabled':''}>السابق</button><div class="dots">${g.steps.map((_,i)=>`<i class="${i===gi?'on':''}"></i>`).join('')}</div><button class="btn sm primary" data-gnext ${gi===g.steps.length-1?'disabled':''}>التالي</button></div>
   <div class="gnav" style="flex-wrap:wrap;gap:8px"><button class="btn sm" data-fake="في النسخة الحقيقية يفتح لك الصفحة المطلوبة في لوحة سلة"><svg style="width:15px;height:15px;vertical-align:-2px"><use href="#ext"/></svg> افتح الصفحة في سلة</button>
   ${g.auto?(planAt('growth')?`<button class="btn sm primary" data-doit="${key}"><svg style="width:15px;height:15px;vertical-align:-2px"><use href="#spark"/></svg> سوّها لي تلقائيًا</button>`:`<button class="btn sm" data-upgrade="growth"><svg style="width:15px;height:15px;vertical-align:-2px"><use href="#lock"/></svg> سوّها لي تلقائيًا (باقة النمو)</button>`):''}</div>
   <p class="faint" style="padding:0 14px 12px">أسماء القوائم هنا للتوضيح، وتُطابق مع لوحة سلة الحالية في النسخة الحقيقية.</p></div>`;
}
function mock(st){
  const items=SIDE_ITEMS.filter((x,i)=>i<5||x===st.side).slice(0,7);

}

function rMonitor(){
  const items=[
   ['اليوم','alert','bad','«دهن العود الملكي» باقي منه 3 حبات','المنتج الأكثر مبيعًا عندك. أعد الطلب من المورد.'],
   ['أمس','tag','info','تغيّر سعر «عطر الورد» من 189 إلى 229 ريال','سنراقب أثر التغيير على مبيعاته خلال أسبوعين.'],
   ['قبل 3 أيام','box','gold','أضفت منتجًا جديدًا بدون وصف وبصورة واحدة','المنتج بدون وصف يبيع أقل. أكمل بياناته.'],
   ['قبل 5 أيام','eye','info','أخفيت تصنيف «البخور»','انتبه: هذا التصنيف جاب 12% من طلبات الشهر الماضي.']];
  const inner=`<div class="card"><div class="tl">${items.map(x=>`<div class="tl-i"><span class="faint">${x[0]}</span><span class="ic" style="background:var(--${x[2]}-soft);color:var(--${x[2]})"><svg><use href="#${x[1]}"/></svg></span><div><b>${x[3]}</b><p class="muted" style="font-size:.88rem">${x[4]}</p></div></div>`).join('')}</div></div>`;
  $('#v-monitor').innerHTML=`<div><h1>مراقبة المتجر</h1><p class="muted">نبض ينتبه لكل تغيير في متجرك (أسعار، مخزون، منتجات، تصنيفات) ويقولك إذا كان له أثر.</p></div>
  ${planAt('growth')?inner:lockHTML('growth',inner,'مراقبة تغييراتك في المتجر','تنبيه لما يخلص منتج، أو يتغير سعر، أو يضاف منتج ناقص البيانات.')}`;
}

/* ================= SMART ================= */
function rSmart(){
  const opps=`<div class="card" style="display:grid;gap:8px"><span class="chip c-market" style="justify-self:start">أهم فرصة</span><h3>214 عميلًا اشتروا قبل 2–4 أشهر ولم يعودوا</h3><p class="muted">الأثر المحتمل: 800 – 2,500 ريال/شهر (تقدير). رسالة وكوبون مع مجموعة ضابطة للقياس.</p><button class="btn primary sm" style="justify-self:start" data-fake="في النسخة الكاملة تفتح التجربة هنا">ابدأ التجربة</button></div>
   <div class="card" style="display:grid;gap:8px"><span class="chip c-store" style="justify-self:start">منتج</span><h3>«مسك الطهارة»: زيارات كثيرة وشراء قليل</h3><p class="muted">1,240 مشاهدة و7 طلبات فقط. صفحته أضعف من المنتجات المشابهة.</p></div>`;
  let body;
  if(S.orders<100){const p=Math.round(S.orders/100*100);
    body=`<div class="card" style="display:grid;gap:10px"><div class="row" style="gap:10px"><span class="lk" style="width:42px;height:42px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center"><svg style="width:22px;height:22px"><use href="#lock"/></svg></span><div><h2>يفتح عند 100 طلب</h2><p class="muted">نبض الذكي يكتشف فرصًا خاصة بمتجرك من بياناته. تحت 100 طلب، البيانات ما تكفي لاستنتاج دقيق، فنركز الحين على الأساسيات في رحلتك.</p></div></div><div><div class="row between faint"><span>طلباتك: <b class="num" style="color:var(--ink)">${S.orders}</b></span><span>100</span></div><div class="bar"><i style="width:${p}%"></i></div></div><button class="btn primary" style="justify-self:start" data-go="journey">كمّل رحلتي</button></div>
    <div class="faint">شكل الفرص لما تفتح:</div><div class="lockwrap"><div class="blur" aria-hidden="true">${opps}</div></div>`;
  } else body=planAt('growth')?opps:lockHTML('growth',opps,'نبض الذكي','فرص مكتشفة من بيانات متجرك، وتجارب تقيس النتيجة.');
  $('#v-smart').innerHTML=`<div><h1>نبض الذكي</h1><p class="muted">الفرص والتجارب المبنية على بيانات متجرك.</p></div>${body}`;
}

/* ================= PLANS ================= */
function rPlans(){
  const rows=[
   ['رحلة التاجر: المراحل والمهام والشرح',['المرحلتان 1 و2','كل المراحل','كل المراحل','كل المراحل']],
   ['النقاط والشارات',[1,1,1,1]],
   ['أدلة سلة خطوة بخطوة',['3 أدلة','كل الأدلة','كل الأدلة','كل الأدلة']],
   ['«سوّها لي» تلقائيًا في سلة (كوبونات، عروض)',[0,0,1,1]],
   ['صانع المحتوى',[0,'20 منشورًا/شهر','60 منشورًا/شهر','غير محدود']],
   ['تقويم المحتوى والمواسم',[0,1,1,1]],
   ['الخطة التسويقية الشهرية الكاملة',['الأسبوع الأول فقط','الأسبوع الأول فقط',1,1]],
   ['مراقبة السوشيال ميديا ونشاطك',[0,0,1,1]],
   ['مراقبة تغييرات المتجر',[0,0,1,1]],
   ['نبض الذكي: الفرص والتجارب (من 100 طلب)',[0,0,1,1]],
   ['التقرير الأسبوعي',[0,1,1,1]],
   ['تنبيهات يومية على الجوال',[0,0,0,1]],
   ['جلسة شهرية مع خبير نمو',[0,0,0,1]],
   ['أعضاء الفريق',['1','1','3','10']]
  ];
  const cell=(v,i)=>`<td class="${PLANS[i].id===S.plan?'cur':''}">${v===1?'<span class="yes">✓</span>':v===0?'<span class="no">—</span>':esc(v)}</td>`;
  $('#v-plans').innerHTML=`<div><h1>الباقات</h1><p class="muted">كل باقة تضيف أدوات جديدة. ابدأ مجانًا وترقّى لما يكبر متجرك.</p></div>
  <div class="tbl"><table><thead><tr><th>الميزة</th>${PLANS.map(p=>`<th class="ph ${p.id===S.plan?'cur':''}"><b>${p.name}</b><span class="pr num">${p.price}</span> <small>ريال/شهر</small><div style="margin-top:6px">${p.id===S.plan?'<span class="chip c-ops">باقتك الحالية</span>':RANK[p.id]>RANK[S.plan]?`<button class="btn sm primary" data-setplan="${p.id}">ترقية</button>`:''}</div></th>`).join('')}</tr></thead>
  <tbody>${rows.map(r=>`<tr><td>${r[0]}</td>${r[1].map(cell).join('')}</tr>`).join('')}</tbody></table></div>
  <p class="faint">الأسعار مبدئية للاختبار. الاشتراك عبر متجر تطبيقات سلة.</p>`;
}

/* ================= EVENTS ================= */
const close=()=>{$('#overlay').innerHTML=''};
function complete(id){if(S.done.has(id))return;S.done.add(id);const t=LEVELS.flatMap(l=>l.tasks).find(x=>x.id===id);toast(`أحسنت! +${t.pts} نقطة`);render(S.view)}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-close]');if(!t)return;
  if(t.classList.contains('scrim')&&e.target!==t)return;
  const d=t.dataset;
  if(d.go){close();go(d.go)}
  else if(d.task)taskDrawer(d.task);
  else if(d.toggle){if(S.done.has(d.toggle)){S.done.delete(d.toggle);render(S.view)}else complete(d.toggle)}
  else if(d.complete){complete(d.complete);taskDrawer(d.complete)}
  else if(d.stage){const n=+d.stage;openStage=openStage===n?-1:n;rJourney()}
  else if(d.gnext!==undefined||d.gprev!==undefined){const key=$('#guide').dataset.g;gi=Math.max(0,Math.min(GUIDES[key].steps.length-1,gi+(d.gnext!==undefined?1:-1)));$('#guide').outerHTML=guideHTML(key)}
  else if(d.doit){toast('أنشأنا كوبون WELCOME10 في متجرك على سلة (معاينة)')}
  else if(d.fake)toast(d.fake);
  else if(d.upgrade){close();go('plans')}
  else if(d.setplan){S.plan=d.setplan;$('#demo-plan').value=S.plan;S.adHidden=false;toast('تمت الترقية إلى '+planName(S.plan)+' (معاينة)');nav();rPlans()}
  else if(d.hidead!==undefined){S.adHidden=true;render(S.view)}
  else if(d.caption){const c=CAPTIONS[+d.caption];$('#cap-out').innerHTML=`<div class="row between" style="margin-bottom:8px"><h3>منشورك جاهز</h3><button class="btn sm" data-copy="${+d.caption}"><svg style="width:15px;height:15px;vertical-align:-2px"><use href="#copy"/></svg> انسخ</button></div><div class="caption">${esc(c)}</div><p class="faint" style="margin-top:6px">راجع النص قبل النشر، وعدّله بأسلوبك.</p>`}
  else if(d.copy!==undefined){const txt=CAPTIONS[+d.copy];try{navigator.clipboard.writeText(txt).then(()=>toast('نُسخ النص'),()=>toast('ظلّل النص وانسخه يدويًا'))}catch(err){toast('ظلّل النص وانسخه يدويًا')}}
  else if(d.close!==undefined)close();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
document.addEventListener('change',e=>{
  if(e.target.id==='demo-orders'){S.orders=+e.target.value;openStage=null;seedDone();render(S.view)}
  if(e.target.id==='demo-plan'){S.plan=e.target.value;S.adHidden=false;nav();render(S.view)}
});

seedDone();
const h=(location.hash||'').slice(1);
go(VIEWS.some(v=>v[0]===h)?h:'home');
})();
</script>
